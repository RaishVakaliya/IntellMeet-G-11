global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "intellmeet-backend"
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - "intellmeet-backend-ovjm.onrender.com"

# Optional: Add remote_write credentials via environment variables or secret manager
# remote_write:
#   - url: ${GRAFANA_CLOUD_URL}
#     basic_auth:
#       username: ${GRAFANA_CLOUD_USERNAME}
#       password: ${GRAFANA_CLOUD_PASSWORD}
